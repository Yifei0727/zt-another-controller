name: Release

# 在打 tag（v*）或手动触发时，交叉编译 4 个目标平台的二进制，
# 并在打 tag 时自动创建 GitHub Release 并附上产物。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- 前端：构建 React 产物，作为 artifact 供后端内嵌 ----
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        working-directory: zt-member-ui
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: zt-member-ui/dist

  # ---- 后端：矩阵交叉编译 4 个目标 ----
  build:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: zt-console-windows-amd64.exe
            binary: zt-console-backend/target/x86_64-pc-windows-msvc/release/zt-console-backend.exe
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: zt-console-macos-aarch64
            binary: zt-console-backend/target/aarch64-apple-darwin/release/zt-console-backend
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: zt-console-linux-musl-x86_64
            binary: zt-console-backend/target/x86_64-unknown-linux-musl/release/zt-console-backend
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: zt-console-linux-musl-aarch64
            binary: zt-console-backend/target/aarch64-unknown-linux-musl/release/zt-console-backend
            zig: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: zt-console-backend/frontend-dist
      - name: Install Rust toolchain + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl-tools (x86_64 musl)
        if: ${{ matrix.musl }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install zig + cargo-zigbuild (aarch64 musl)
        if: ${{ matrix.zig }}
        run: |
          # ubuntu-24.04 默认源没有 zig 包，改用官方 tarball 安装
          ZIG_VER=0.13.0
          curl -sSL "https://ziglang.org/download/${ZIG_VER}/zig-linux-x86_64-${ZIG_VER}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz
          sudo mv "zig-linux-x86_64-${ZIG_VER}" /opt/zig
          echo "/opt/zig" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked
      - name: Build
        shell: bash
        run: |
          # 不 cd，用 --manifest-path 保证 matrix.binary 路径（相对仓库根）正确
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --manifest-path zt-console-backend/Cargo.toml --release --target ${{ matrix.target }}
          else
            cargo build --manifest-path zt-console-backend/Cargo.toml --release --target ${{ matrix.target }}
          fi
          # 重命名为唯一产物名，避免 release 阶段 flatten 时同名二进制互相覆盖
          # 注意：用工作区相对路径 out/ 而非 /tmp/out —— upload-artifact 是 Node 动作，
          # Windows 上无法解析 git-bash 的虚拟 /tmp 路径，会导致「No files found」。
          mkdir -p out
          cp "${{ matrix.binary }}" "out/${{ matrix.artifact }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}

  # ---- 打 tag 时汇总产物并创建 Release ----
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # 只下载 4 个平台二进制；frontend-dist 已被 rust-embed 编进后端二进制，
      # 不应作为独立 Release 产物发布。
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: zt-console-*
          merge-multiple: false
      - name: Stage assets
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # ---- 镜像：用已交叉编译的 linux-musl 二进制构建多架构 Docker 镜像 ----
  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download linux-musl binaries
        uses: actions/download-artifact@v4
        with:
          pattern: zt-console-linux-musl-*
          path: dist
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ZeroTier 自建控制器控制台（Rust axum + React 前端，单文件二进制）
            org.opencontainers.image.licenses=MIT
